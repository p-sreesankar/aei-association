name: CI Build (Vercel Hosted)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate config
        run: npm run validate:config

      - name: Validate mock tests
        run: npm run validate:tests

      - name: Validate resources
        run: npm run validate:resources

      - name: Build
        run: npm run build
